# grub-boot-success.service ships from the Hummingbird base image and is
# enabled by preset; grub-boot-success.timer (a user unit, enabled in
# configure-services.sh) fires it periodically. Its script calls grub2-editenv,
# which writes /boot/grub2/grubenv -- but ostree remounts /boot read-only at
# runtime, so on Utah the unit fails on every fire, and nothing consumes the
# flag. Gate it so it only runs where /boot is writable (a non-ostree install),
# mirroring bootc-unified-storage.service's
# ConditionPathExists=/run/ostree-booted. On an ostree system the condition
# fails and systemd skips the unit instead of failing it -- that is exactly
# what the systemd-boot case in #364 also sees.
[Unit]
!ConditionPathExists=/run/ostree-booted
